name: Build Unity WebGL Game 

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      # 1. جلب الكود من GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. عمل Cache لمجلد Library لتسريع البناء
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. خطوة البناء عبر Unity Builder
      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_KEY_ID }}
          UNITY_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_KEY_SECRET }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto

      # 4. رفع ناتج البناء (Build) على GitHub Artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL
